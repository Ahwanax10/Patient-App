<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>شرح حال بیماران</title>
    <script>
    (function() {
        var theme = localStorage.getItem('theme') || 'light';
        if (theme === 'dark') {
            document.documentElement.classList.add('dark');
        }
    })();
</script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00897B">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>شرح حال بیماران</h1>
      <button id="theme-toggle-btn" title="حالت تیره/روشن"><i data-lucide="moon"></i></button>
    </header>
    <button id="new-patient-btn" title="بیمار جدید" onclick="window.location.href='form.html'"><i data-lucide="plus"></i></button>
    <main>
      <div class="search-bar">
    <button type="button" id="filter-toggle-btn" title="فیلتر">
        <i data-lucide="sliders-horizontal"></i>
    </button>
    <div class="search-pill">
        <input type="text" id="search-input" placeholder="جستجوی بیمار...">
        <button type="button" id="search-icon-btn" title="جستجو">
            <i data-lucide="search"></i>
        </button>
    </div>
</div>
      

<div id="filter-panel" style="display: none;">

    <div class="form-grid">
        <div class="form-group">
            <label for="filter-age-min">حداقل سن</label>
            <input type="number" id="filter-age-min">
        </div>
        <div class="form-group">
            <label for="filter-age-max">حداکثر سن</label>
            <input type="number" id="filter-age-max">
        </div>
        <div class="form-group">
            <label for="filter-gender">جنسیت</label>
            <select id="filter-gender">
                <option value="">همه</option>
                <option value="مرد">مرد</option>
                <option value="زن">زن</option>
            </select>
        </div>
    </div>

    <fieldset>
        <legend>بخش‌های بدن (Categories)</legend>
        <div class="checkbox-grid" id="filter-categories-list">
        </div>
    </fieldset>

    <button type="button" id="apply-filter-btn">اعمال فیلتر</button>
    <button type="button" id="clear-filter-btn">پاک کردن فیلتر</button>

</div>
      <div id="patient-list"></div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js"></script>
    <script src="app.js"></script>
    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }
</script>
  </body>
</html>
